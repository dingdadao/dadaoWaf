[package]
name = "homewaf-admin"
description = "HomeWAF 管理 API 与 Web 控制台"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
homewaf-config = { path = "../config" }
homewaf-store = { path = "../store" }
homewaf-acl = { path = "../acl" }
homewaf-router = { path = "../router" }
homewaf-detect = { path = "../detect" }
homewaf-limit = { path = "../limit" }
homewaf-proxy = { path = "../proxy" }
ipnet.workspace = true
axum = "0.8"
anyhow = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "time"] }
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"
maxminddb = "0.32.0"
# 默认地理信息库下载（jsDelivr 提供 .gz，需要本地解压）
ureq = "3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# 证书域名 / 有效期解析
x509-parser = "0.16"
# 远程部署 API Token 的安全随机数
ring = "0.17"
