[package]
name = "homewaf"
description = "HomeWAF 命令行入口"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "homewaf"
path = "src/main.rs"

[dependencies]
homewaf-config = { path = "../config" }
homewaf-detect = { path = "../detect" }
homewaf-router = { path = "../router" }
homewaf-acl = { path = "../acl" }
homewaf-store = { path = "../store" }
homewaf-admin = { path = "../admin" }
homewaf-proxy = { path = "../proxy" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_yaml.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
